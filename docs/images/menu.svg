<title id='t'>The LocoHost menu</title><desc id='d'>A drawing of the LocoHost menu. The top line counts 11 localhosts, 4 in use, 3 quiet, 21% CPU and 9.0 GB. Below it are Close Idle, which will stop 3 servers holding 1.5 GB, and Review Now with Haiku or Luna, last run 12 minutes ago by Haiku. Then come the servers in use, such as Vite on port 3317 in the page-builder worktree, open in headless Chrome. Next are the quiet ones, such as two Phoenix servers up for 12 and 7 days with nobody connected for 3 hours, which the review calls idle. Services such as Postgres are listed apart and never closed.</desc>
